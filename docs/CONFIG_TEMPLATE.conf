# Byte Fault Fuzzer Raw run configuration, format version 1
# Copy this file anywhere and select it with bytefault --config PATH or bytefault COMMAND --config PATH.
# All assignments below are commented. Uncomment only selections for one run.
# Replace VALUE, PATH, and JSON placeholders with actual values before use.
# Values after the first space remain one argument; quote the whole value to keep # or edge spaces.
# Backslashes remain literal. Double a matching outer quote to include it in a quoted value.
# JSON values are passed directly, not read from @files. Use the owning option's expected JSON shape.
# For [run] intent-json or request-json, write JSON directly after the key without shell quotes.
# Offline example: uncomment command, protocol, host, port, and seed-hex; set your own host/port.
# Change command to fuzz only when ready to send to that host.
format-version 1

# Select one public command. Supply its entire positional group here or entirely on the CLI.
# Fuzz/submit/configure/prepare/validate: optional protocol plus required host.
# Replay: protocol, host, and one or more packet lines in sending order.
# Maintenance: optional host. Other commands use their named positional fields below.
[run]
# command configure  # offline example; required when no CLI command is given
# protocol raw  # fuzz/replay example; no universal protocol default
# host 192.0.2.10  # example, required for fuzz/replay
# packet 00ff  # replay only; repeat this line in packet order
# declaration-json VALUE  # generic command positional; use only for the selected command
# run-id VALUE  # generic command positional; use only for the selected command
# control VALUE  # generic command positional; use only for the selected command
# path VALUE  # generic command positional; use only for the selected command
# record-id VALUE  # generic command positional; use only for the selected command
# intent-json VALUE  # generic command positional; use only for the selected command
# owner VALUE  # generic command positional; use only for the selected command
# request-json VALUE  # generic command positional; use only for the selected command

# Fuzz campaign and generation settings (fuzz, submit, configure, prepare, validate).
[fuzz]
# action VALUE  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate
# auto-length false  # context-dependent; omission preserves submitted setting, new request defaults false; fuzz, submit, configure, prepare, validate
# base VALUE  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate
# base-packet VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# base-payload VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# campaign-json JSON  # tagged cases/generation/options/monitoring_configuration object; fuzz, submit, configure, prepare, validate
# case-limit VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# cases VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# check-interval 1  # default 1; fuzz, submit, configure, prepare, validate
# connection-json JSON  # tagged CampaignConnection object; fuzz, submit, configure, prepare, validate
# crash-delay 50  # default 50; fuzz, submit, configure, prepare, validate
# crash-throttle 5  # default 5; fuzz, submit, configure, prepare, validate
# datasets-json JSON  # tagged dataset mapping; fuzz, submit, configure, prepare, validate
# delayed-crash-check 0.0  # default 0.0; fuzz, submit, configure, prepare, validate
# exclude VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# exclude2 VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# field-same false  # default false; fuzz, submit, configure, prepare, validate
# fuzz-stage VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# gen-field @1:random:10-100,exclude:0x00-0x1f,count:100  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate
# gen-strategy single  # default single; fuzz, submit, configure, prepare, validate
# generation-json JSON  # tagged sources/sets/positions object; fuzz, submit, configure, prepare, validate
# generation-limit VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# list-stages false  # default false; fuzz, submit, configure, prepare, validate
# list-targets false  # default false; fuzz, submit, configure, prepare, validate
# mask VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# mask2 VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# monitoring-json JSON  # tagged MonitoringConfig object; fuzz, submit, configure, prepare, validate
# mutate-count 100  # default 100; fuzz, submit, configure, prepare, validate
# mutate-max-len VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# mutate-raw false  # default false; fuzz, submit, configure, prepare, validate
# mutate-rng-seed VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# mutate-scope per_test  # default per_test; fuzz, submit, configure, prepare, validate
# mutate-seed VALUE  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate
# mutate-seed-dir VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# mutate-seed-file VALUE  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate
# mutate-seed-format binary  # default binary; fuzz, submit, configure, prepare, validate
# no-auto-length false  # context-dependent; omission preserves submitted setting, new request defaults false; fuzz, submit, configure, prepare, validate
# non-persistent false  # default false; fuzz, submit, configure, prepare, validate
# offset-range VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# offset-scope per_test  # default per_test; fuzz, submit, configure, prepare, validate
# offset-seed VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# pad-byte 00  # default 00; fuzz, submit, configure, prepare, validate
# persistent false  # default false; fuzz, submit, configure, prepare, validate
# prefix VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# random-byte-range VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# random-content-scope per_test  # default per_test; fuzz, submit, configure, prepare, validate
# random-iter 100  # default 100; fuzz, submit, configure, prepare, validate
# random-len VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# random-length-scope per_test  # default per_test; fuzz, submit, configure, prepare, validate
# random-range-choices VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# random-range-scope per_test  # default per_test; fuzz, submit, configure, prepare, validate
# random-seed VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# reconnect-attempts 5  # default 5; fuzz, submit, configure, prepare, validate
# reconnect-delay 1.0  # default 1.0; fuzz, submit, configure, prepare, validate
# recovery-delays 3,5,10,15,17  # default recovery schedule when omitted; fuzz, submit, configure, prepare, validate
# request-json JSON  # exported conversation value; fuzz, submit, configure, prepare, validate
# retries 3  # default 3; fuzz, submit, configure, prepare, validate
# seed-hex 414243  # example exact bytes ABC; fuzz, submit, configure, prepare, validate
# skip 0  # default 0; fuzz, submit, configure, prepare, validate
# start VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# start2 VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# target VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# target2 VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# test-length-mismatch false  # default false; fuzz, submit, configure, prepare, validate

# Ordered literal replay settings.
[replay]
# enable-crash-handling false  # default false; replay
# fuzz-target VALUE  # unset or context-dependent; replay
# prepare false  # default false; replay
# recovery-attempts 10  # default 10; used with enable-crash-handling; replay
# recovery-wait 5.0  # default 5.0; used with enable-crash-handling; replay
# value VALUE  # unset or context-dependent; replay
# wait 0.0  # pre-connection delay per literal packet, default 0.0; replay

# Selected local or SSH remote maintenance.
[maintenance]
# local-cache PATH  # maintenance; defaults to attached Collection's cache if present
#                   standalone default artifacts/runs/results/collection, or RESULTS/collection with --results RESULTS
# local-entry VALUE  # exact relative path within local cache, repeatable; omission selects root; maintenance
# local-only false  # default false; maintenance
# remote-dir /root/cores  # default /root/cores; maintenance
# remote-entry VALUE  # exact immediate remote basename, repeatable; omission selects discovered cores; maintenance
# remote-only false  # default false; maintenance

# Saved-case and resume-run client controls.
[prepared]
# execute false  # default false; resume-run, saved-case, saved-intent

# Passive application inspection, records, service and control options.
[generic]
# after 0  # default 0; observe
# directory VALUE  # inspect selects a discovery root

# Explicit core collection and SSH credentials where supported.
[collection]
# collect-cores false  # default false; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# core-cache PATH  # normal CLI default RESULT_BIN/collection; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
#                  RESULT_BIN is dated beside records or selected by --results
# core-dir /root/cores  # default /root/cores; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# core-dump-wait 5.0  # default 5.0; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# core-max-size 0  # default 0; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# core-timeout 30  # default 30; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# ssh-key PATH  # unset or context-dependent; fuzz, replay, maintenance, submit, configure, prepare, validate, resume-run, saved-case, saved-intent; alias -k on fuzz/replay/prepared; maintenance uses --ssh-key
# ssh-pass PASSWORD  # unset or context-dependent; fuzz, replay, maintenance, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# ssh-user VALUE  # key mode defaults to root; password mode requires an explicit user; fuzz, replay, maintenance, submit, configure, prepare, validate, resume-run, saved-case, saved-intent

# Records, results, log and display controls where supported.
[output]
# debug false  # default false; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# hide-field VALUE  # repeatable; no entries by default; fuzz, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# log-file VALUE  # unset or context-dependent; fuzz, replay, maintenance, submit, configure, prepare, validate, resume-run, saved-case, saved-intent; alias -l on fuzz/replay/prepared; maintenance uses --log-file
# no-test-banner false  # default omitted (test banner enabled); fuzz, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# no-ui false  # default false; Plain on an interactive terminal for executing commands; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# records PATH  # unset or context-dependent; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# results PATH  # unset or context-dependent; fuzz, replay, maintenance, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# ui false  # default false; Rich on an interactive terminal if installed, otherwise Plain, for executing commands; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent; alias --tui
# verbose 0  # default 0; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent; alias -v

# Transport and service timing where supported.
[timing]
# connection-delay 0.0  # default 0.0; fuzz, replay, maintenance, submit, configure, prepare, validate
# heartbeat false  # default false; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# heartbeat-interval 2.0  # default 2.0; fuzz, replay, submit, configure, prepare, validate, resume-run, saved-case, saved-intent
# tcp-post-delay VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# tcp-pre-delay VALUE  # unset or context-dependent; fuzz, submit, configure, prepare, validate
# tcp-spacing VALUE  # deprecated alias for tcp-pre-delay; fuzz, submit, configure, prepare, validate
# timeout VALUE  # fuzz protocol-derived or 3.0; replay 3.0; maintenance 30; fuzz, replay, maintenance, submit, configure, prepare, validate

# Shared Raw options supported by the selected command.
[options]
# declaration-dir VALUE  # unset or context-dependent; fuzz, replay, submit, configure, prepare, validate
# fuzz-length 2  # fuzz default 2; replay unset and used only as crash metadata; fuzz, replay, submit, configure, prepare, validate
# health-check-mode new_connection  # Raw default; fuzz/submit/configure/prepare/validate also accept in_band with prepared check bytes/predicate; replay accepts new_connection or disabled
# no-recv false  # default false; fuzz, replay, submit, configure, prepare, validate, saved-case, saved-intent; alias --no-receive on saved-case/saved-intent only
# offset VALUE  # fuzz byte offset; replay crash metadata only; fuzz, replay, submit, configure, prepare, validate
# port 1234  # example; required for Raw fuzz/replay, otherwise declaration-dependent; fuzz, replay, submit, configure, prepare, validate
# receive-cap VALUE  # unset or context-dependent; fuzz, replay, submit, configure, prepare, validate
# receive-deadline VALUE  # unset or context-dependent; fuzz, replay, submit, configure, prepare, validate
